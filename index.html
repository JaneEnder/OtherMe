<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OtherMe — explore how chance shapes identity.">
  <title>OtherMe — Me, By Chance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <p class="eyebrow">OTHERME</p>
    <h1>Me, By Chance</h1>
    <p class="intro">How much of who we are began with a roll of the dice?</p>

    <section class="card" aria-labelledby="identity-heading">
      <h2 id="identity-heading">Build another possible you</h2>
      <p class="hint">Choose an option or let chance decide.</p>

      <div class="field">
        <label for="sex">Sex at birth</label>
        <div class="control-row">
          <select id="sex">
            <option value="">Choose an option</option>
            <option>Female</option>
            <option>Male</option>
            <option>Intersex</option>
          </select>
          <button class="dice" type="button" data-target="sex" aria-label="Randomize sex at birth">🎲</button>
        </div>
      </div>

      <div class="field">
        <label for="country">Country of birth</label>
        <div class="control-row">
          <select id="country">
            <option value="">Choose a country</option>
            <option>Brazil</option>
            <option>India</option>
            <option>Nigeria</option>
            <option>Romania</option>
            <option>United States</option>
          </select>
          <button class="dice" type="button" data-target="country" aria-label="Randomize country of birth">🎲</button>
        </div>
      </div>

      <div class="field">
        <label for="religion">Religion raised in</label>
        <div class="control-row">
          <select id="religion">
            <option value="">Choose an option</option>
            <option>Buddhism</option>
            <option>Christianity</option>
            <option>Hinduism</option>
            <option>Islam</option>
            <option>Judaism</option>
            <option>No religion</option>
          </select>
          <button class="dice" type="button" data-target="religion" aria-label="Randomize religion raised in">🎲</button>
        </div>
      </div>

      <button id="randomize-all" class="primary" type="button">Roll all three</button>
      <p id="result" class="result" aria-live="polite">Your alternate starting point will appear here.</p>
    </section>

    <p class="disclaimer">Prototype only — options are placeholders, not statistical data.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
